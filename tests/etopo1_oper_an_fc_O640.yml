grid:        O640
cldomain:     g
directions:  36
frequencies: 29
fr1:         4.177248E-02 
ifre1:       3
bathymetry:  ETOPO1
lsubgrid:    T

advection:
    irefra: 2
    timestep: 720 
    fast_waves:
