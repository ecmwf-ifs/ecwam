grid:        lam_highres 
cldomain:     m
directions:  36
frequencies: 36
fr1:         0.055
ifre1:       1
bathymetry:  ETOPO1
lsubgrid:    F

advection:
    irefra: 0
    timestep: 120
    fast_waves:
        timestep: 60
        max_frequency: 5
physics:
    iphys: 1
    timestep: 240
    llgcbz0: T
    llnormagam: T
    lmaskice: F
    lciwa3: T
    lciscal: T

analysis.begin: 2022-12-31 12:00:00
analysis.end:   2023-01-01 00:00:00
forecast.begin: 2023-01-01 00:00:00
forecast.end:   2023-01-01 06:00:00

begin: ${analysis.begin}
end:   ${forecast.end}

nproma: 24
lgribin: F
lgribout: F

forcings:
    sea_ice: False 

    file:  data/forcings/oper_an_12h_fc_2023010100_36h_O1280.grib

    at:
      - begin:     ${analysis.begin}
        end:       ${analysis.end}
        timestep:  06:00
      - begin:     ${forecast.begin}
        end:       ${forecast.end}
        timestep:  01:00

output:
    fields:
        name:
          - swh         # Significant height of combined wind waves and swell
          - mwd         # Mean wave direction
          - mwp         # Mean wave period
          - pp1d        # Peak wave period
          - dwi         # 10 metre wind direction
          - cdww        # Coefficient of drag with waves
          - wind        # 10 metre wind speed
        format: grib    # (default : grib) or binary
        at:
          - timestep: 01:00

    restart:
        format: binary # (default : binary) or grib
        at:
          - time: ${analysis.end}


validation:

  double_precision:

    # initial analysis time
    - name: swh
      time: 2022-12-31 12:00:00
      average: 0.3187297962906810E+00
      relative_tolerance: 1.e-14
      hashes: ['0x3FD46611A8D511E4']

    # initial forecast time
    - name: swh
      time: 2023-01-01 00:00:00
      average: 0.2302391668008773E+00
      relative_tolerance: 1.e-14
      hashes: ['0x3FCD787A1DD582E3']

    # 6h into forecast
    - name: swh
      time: 2023-01-01 06:00:00
      average: 0.2536693790443733E+00
      relative_tolerance: 1.e-14
      hashes: ['0x3FD03C1E7DBF8062']
    - name: swh
      time: 2023-01-01 06:00:00
      minimum: 0.2172002527339524E-01
      relative_tolerance: 1.e-14
      hashes: ['0x3F963DC638DEBF24']
    - name: swh
      time: 2023-01-01 06:00:00
      maximum: 0.9275511810397951E+00
      relative_tolerance: 1.e-14
      hashes: ['0x3FEDAE7FD07DD3B9']
